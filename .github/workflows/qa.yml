name: QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/sistema-burger-test?replicaSet=rs0
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/sistema-burger-test?replicaSet=rs0
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar MongoDB con transacciones
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for intento in {1..30}; do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'; then break; fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for intento in {1..30}; do
            if docker exec mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Ejecutar tests
        run: npm test

      - name: Verificar vulnerabilidades del backend
        run: npm audit --omit=dev --audit-level=high

  panel:
    name: Panel build, lint y auditoría
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: panel

    env:
      VITE_API_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high



